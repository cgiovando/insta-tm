name: HOT Tasking Manager Cloud Native Mirror Sync

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Allow manual trigger

concurrency:
  group: insta-tm-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install tippecanoe
        env:
          # Pinned so an upstream change cannot silently alter the tiles.
          # This commit is tippecanoe v2.82.0.
          TIPPECANOE_REF: 4f2621186acfec33b63ddf636f665623c0fef2dd
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone https://github.com/felt/tippecanoe.git
          cd tippecanoe
          git checkout "$TIPPECANOE_REF"
          make -j$(nproc)
          sudo make install
          tippecanoe --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run ETL script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          # Optional: endpoint for S3-compatible storage such as Cloudflare R2
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        run: python etl.py
