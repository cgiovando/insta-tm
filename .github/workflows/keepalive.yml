name: Keepalive

# Why this exists
#
# GitHub automatically disables scheduled workflows in public repositories
# after 60 days of repository inactivity. This repo's data workflows write
# their output to object storage and never push back here, so nothing resets
# that clock and the schedules get silently switched off. That is what
# happened on 2026-07-31.
#
# This job makes a trivial timestamp commit twice a month. That counts as
# repository activity and keeps every scheduled workflow in this repo enabled,
# including this one. Pushes made with GITHUB_TOKEN do not trigger workflow
# runs, so this cannot loop.
#
# Note that disabling is sticky: once GitHub has switched a workflow off, a
# later push resets the clock but does NOT turn it back on. It has to be
# re-enabled by hand. So the point of this job is prevention, not recovery.
#
# It touches nothing else. Deleting this file is safe; the only consequence is
# that the scheduled workflows here go back to expiring every 60 days.

on:
  schedule:
    # 1st and 15th of each month at 05:17 UTC. Longest gap is 17 days (15 Jan
    # to 1 Feb) against a 60-day budget, so several consecutive failures are
    # survivable. Deliberately off the top of the hour: GitHub deprioritizes
    # scheduled runs at :00 when the queue is busy, and may drop them.
    - cron: "17 5 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update keepalive stamp and push
        run: |
          set -euo pipefail

          {
            echo "Last keepalive: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Written by .github/workflows/keepalive.yml."
            echo "Its only purpose is to create repository activity so GitHub does not"
            echo "auto-disable this repository's scheduled workflows after 60 days."
            echo "Nothing reads this file."
          } > .github/keepalive.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt

          if git diff --staged --quiet; then
            echo "No change to commit; nothing to do."
            exit 0
          fi

          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"

          # Survive a non-fast-forward if anything else pushed to this branch
          # between checkout and now. Rebase our single commit and retry.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto origin/${GITHUB_REF_NAME}."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

          echo "Push failed after 3 attempts." >&2
          exit 1
